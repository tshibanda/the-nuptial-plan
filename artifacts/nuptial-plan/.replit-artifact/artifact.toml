kind = "web"
previewPath = "/"
title = "The Nuptial Plan"
version = "1.0.0"
id = "artifacts/nuptial-plan"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21776

[services.development]
run = "pnpm --filter @workspace/nuptial-plan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nuptial-plan", "run", "build" ]
serve = "static"
publicDir = "artifacts/nuptial-plan/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21776"
BASE_PATH = "/"
