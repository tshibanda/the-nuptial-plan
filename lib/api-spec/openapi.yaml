openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: The Nuptial Plan – Wedding planner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: weddings
    description: Wedding file management
  - name: vendors
    description: Vendor team management
  - name: address-book
    description: Planner address book and favorite vendors
  - name: guests
    description: Guest list management
  - name: public-rsvp
    description: Public guest RSVP responses
  - name: notifications
    description: Planner notifications
  - name: budget
    description: Budget tracking
  - name: events
    description: Calendar events and milestones
  - name: contracts
    description: Contract tracking
  - name: payments
    description: Payment tracking
  - name: dashboard
    description: Dashboard summary data
  - name: openai
    description: OpenAI AI chat, image, and audio operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Weddings ─────────────────────────────────────────────────
  /weddings:
    get:
      operationId: listWeddings
      tags: [weddings]
      summary: List all weddings
      responses:
        "200":
          description: List of weddings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wedding"
    post:
      operationId: createWedding
      tags: [weddings]
      summary: Create a new wedding file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeddingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wedding"

  /weddings/{id}:
    get:
      operationId: getWedding
      tags: [weddings]
      summary: Get a wedding by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Wedding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wedding"
        "404":
          description: Not found
    patch:
      operationId: updateWedding
      tags: [weddings]
      summary: Update a wedding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeddingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wedding"
    delete:
      operationId: deleteWedding
      tags: [weddings]
      summary: Delete a wedding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /weddings/{id}/summary:
    get:
      operationId: getWeddingSummary
      tags: [dashboard]
      summary: Get dashboard summary for a wedding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeddingSummary"

  /weddings/{id}/activity:
    get:
      operationId: getWeddingActivity
      tags: [dashboard]
      summary: Get recent activity feed for a wedding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ─── Vendors ──────────────────────────────────────────────────
  /weddings/{weddingId}/vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Add a vendor to a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /weddings/{weddingId}/vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get a vendor by ID
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Not found
    patch:
      operationId: updateVendor
      tags: [vendors]
      summary: Update a vendor
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
    delete:
      operationId: deleteVendor
      tags: [vendors]
      summary: Delete a vendor
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /address-book:
    get:
      operationId: listAddressBookEntries
      tags: [address-book]
      summary: List the planner's saved vendor contacts
      responses:
        "200":
          description: Address book entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressBookEntry"
    post:
      operationId: createAddressBookEntry
      tags: [address-book]
      summary: Save a vendor contact to the planner's address book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBookEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookEntry"

  /address-book/{id}:
    patch:
      operationId: updateAddressBookEntry
      tags: [address-book]
      summary: Update a saved vendor contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBookEntryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressBookEntry"
        "404":
          description: Not found
    delete:
      operationId: deleteAddressBookEntry
      tags: [address-book]
      summary: Delete a saved vendor contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /weddings/{weddingId}/vendors/from-address-book/{addressBookId}:
    post:
      operationId: addAddressBookEntryToWedding
      tags: [address-book]
      summary: Add a saved vendor contact to a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: addressBookId
          in: path
          required: true
          schema:
            type: number
      responses:
        "201":
          description: Vendor created from address book entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Not found

  # ─── Guests ───────────────────────────────────────────────────
  /weddings/{weddingId}/guests:
    get:
      operationId: listGuests
      tags: [guests]
      summary: List guests for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of guests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"
    post:
      operationId: createGuest
      tags: [guests]
      summary: Add a guest to a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"

  /weddings/{weddingId}/guests/{id}:
    patch:
      operationId: updateGuest
      tags: [guests]
      summary: Update a guest
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
    delete:
      operationId: deleteGuest
      tags: [guests]
      summary: Delete a guest
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /weddings/{weddingId}/guests/{id}/rsvp-link:
    post:
      operationId: createGuestRsvpLink
      tags: [guests]
      summary: Create or retrieve a public RSVP link for a guest
      parameters:
        - name: weddingId
          in: path
          required: true
          schema: { type: number }
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: RSVP link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpLink"

  /weddings/{weddingId}/guests/stats:
    get:
      operationId: getGuestStats
      tags: [guests]
      summary: RSVP stats for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Guest stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStats"

  /weddings/{weddingId}/guests/import:
    post:
      operationId: importGuests
      tags: [guests]
      summary: Bulk import guests from parsed spreadsheet rows
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestImportResult"

  /public/rsvp/{token}:
    get:
      operationId: getPublicRsvp
      tags: [public-rsvp]
      summary: Get the invitation details for a public RSVP link
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRsvp"
  /public/rsvp/{token}/respond:
    post:
      operationId: respondPublicRsvp
      tags: [public-rsvp]
      summary: Save a guest RSVP response
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicRsvpResponse"
      responses:
        "200":
          description: Saved RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRsvpResponseResult"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for a wedding
      parameters:
        - name: weddingId
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/push-token:
    post:
      operationId: registerPushToken
      tags: [notifications]
      summary: Register a mobile push-notification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRegistration"
      responses:
        "200":
          description: Registered push token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTokenRegistrationResult"
    delete:
      operationId: unregisterPushToken
      tags: [notifications]
      summary: Unregister a mobile push-notification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenUnregistration"
      responses:
        "204":
          description: Push token removed
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"



  # ─── Budget ───────────────────────────────────────────────────
  /weddings/{weddingId}/budget-categories:
    get:
      operationId: listBudgetCategories
      tags: [budget]
      summary: List budget categories for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of budget categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetCategory"
    post:
      operationId: createBudgetCategory
      tags: [budget]
      summary: Create a budget category
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetCategory"

  /weddings/{weddingId}/budget-categories/{id}:
    patch:
      operationId: updateBudgetCategory
      tags: [budget]
      summary: Update a budget category
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetCategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetCategory"
    delete:
      operationId: deleteBudgetCategory
      tags: [budget]
      summary: Delete a budget category
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /weddings/{weddingId}/budget-summary:
    get:
      operationId: getBudgetSummary
      tags: [budget]
      summary: Aggregate budget summary for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Budget summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSummary"

  # ─── Events ───────────────────────────────────────────────────
  /weddings/{weddingId}/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List calendar events for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a calendar event
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"

  /weddings/{weddingId}/events/{id}:
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update a calendar event
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete a calendar event
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── Contracts ────────────────────────────────────────────────
  /weddings/{weddingId}/contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List contracts for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
    post:
      operationId: createContract
      tags: [contracts]
      summary: Create a contract
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /weddings/{weddingId}/contracts/{id}:
    patch:
      operationId: updateContract
      tags: [contracts]
      summary: Update a contract
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
    delete:
      operationId: deleteContract
      tags: [contracts]
      summary: Delete a contract
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── Payments ─────────────────────────────────────────────────
  /weddings/{weddingId}/payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a payment
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /weddings/{weddingId}/payments/{id}:
    patch:
      operationId: updatePayment
      tags: [payments]
      summary: Update a payment
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
    delete:
      operationId: deletePayment
      tags: [payments]
      summary: Delete a payment
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── OpenAI / Nuptia chat ────────────────────────────────────────────────
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── Wedding ──────────────────────────────────────────────
    Wedding:
      type: object
      required: [id, names, currency, weddingDate, venue, totalBudget, guestCount, createdAt]
      properties:
        id:
          type: number
        names:
          type: string
          description: "e.g. Sophie & James Hartwell"
        partner1:
          type: string
          description: "Prénom du premier marié"
        partner2:
          type: string
          description: "Prénom du second marié"
        currency:
          type: string
          description: "ISO 4217 currency code, e.g. EUR, GBP, USD"
        weddingDate:
          type: string
          description: ISO date string (YYYY-MM-DD)
        venue:
          type: string
        totalBudget:
          type: number
          description: Total budget in minor currency units (cents/pence)
        guestCount:
          type: number
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    WeddingInput:
      type: object
      required: [names, currency, weddingDate, venue, totalBudget, guestCount]
      properties:
        names:
          type: string
        partner1:
          type: string
        partner2:
          type: string
        currency:
          type: string
        weddingDate:
          type: string
        venue:
          type: string
        totalBudget:
          type: number
        guestCount:
          type: number
        notes:
          type: string

    WeddingUpdate:
      type: object
      properties:
        names:
          type: string
        partner1:
          type: string
        partner2:
          type: string
        currency:
          type: string
        weddingDate:
          type: string
        venue:
          type: string
        totalBudget:
          type: number
        guestCount:
          type: number
        notes:
          type: string

    WeddingSummary:
      type: object
      required: [weddingId, daysUntil, confirmedGuests, totalGuests, budgetSpent, budgetTotal, tasksComplete, tasksTotal, upcomingEvents, vendorCount, pendingPaymentsTotal]
      properties:
        weddingId:
          type: number
        daysUntil:
          type: number
        confirmedGuests:
          type: number
        totalGuests:
          type: number
        budgetSpent:
          type: number
        budgetTotal:
          type: number
        tasksComplete:
          type: number
        tasksTotal:
          type: number
        upcomingEvents:
          type: number
        vendorCount:
          type: number
        pendingPaymentsTotal:
          type: number

    ActivityItem:
      type: object
      required: [id, weddingId, description, entityType, createdAt]
      properties:
        id:
          type: number
        weddingId:
          type: number
        description:
          type: string
        entityType:
          type: string
          enum: [vendor, guest, contract, payment, event, wedding]
        initials:
          type: ["string", "null"]
        createdAt:
          type: string

    # ─── Vendor ───────────────────────────────────────────────
    Vendor:
      type: object
      required: [id, weddingId, name, category, status, totalAmountCents, createdAt]
      properties:
        id:
          type: number
        weddingId:
          type: number
        name:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [confirmed, awaiting_contract, deposit_paid, cancelled]
        totalAmountCents:
          type: number
        depositAmountCents:
          type: ["number", "null"]
        contactName:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    VendorInput:
      type: object
      required: [name, category, status, totalAmountCents]
      properties:
        name:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [confirmed, awaiting_contract, deposit_paid, cancelled]
        totalAmountCents:
          type: number
        depositAmountCents:
          type: number
        contactName:
          type: string
        contactEmail:
          type: string
        notes:
          type: string

    VendorUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [confirmed, awaiting_contract, deposit_paid, cancelled]
        totalAmountCents:
          type: number
        depositAmountCents:
          type: number
        contactName:
          type: string
        contactEmail:
          type: string
        notes:
          type: string

    AddressBookEntry:
      type: object
      required: [id, ownerId, name, category, createdAt]
      properties:
        id:
          type: number
        ownerId:
          type: string
        name:
          type: string
        category:
          type: string
        contactName:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    AddressBookEntryInput:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
        category:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        website:
          type: string
        notes:
          type: string

    AddressBookEntryUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        website:
          type: string
        notes:
          type: string

    # ─── Guest ────────────────────────────────────────────────
    Guest:
      type: object
      required: [id, weddingId, name, rsvpStatus, createdAt]
      properties:
        id:
          type: number
        weddingId:
          type: number
        name:
          type: string
        email:
          type: ["string", "null"]
        tableNumber:
          type: ["string", "null"]
        dietaryRequirements:
          type: ["string", "null"]
        rsvpStatus:
          type: string
          enum: [confirmed, pending, declined]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    RsvpLink:
      type: object
      required: [token, url]
      properties:
        token: { type: string }
        url: { type: string }

    PublicRsvp:
      type: object
      required: [guest, wedding]
      properties:
        guest:
          type: object
          required: [id, name, rsvpStatus]
          properties:
            id: { type: number }
            name: { type: string }
            rsvpStatus:
              type: string
              enum: [confirmed, pending, declined]
        wedding:
          type: object
          required: [id, names, weddingDate, venue]
          properties:
            id: { type: number }
            names: { type: string }
            weddingDate: { type: string }
            venue: { type: string }

    PublicRsvpResponse:
      type: object
      required: [rsvpStatus]
      properties:
        rsvpStatus:
          type: string
          enum: [confirmed, declined]

    PublicRsvpResponseResult:
      type: object
      required: [guest]
      properties:
        guest:
          type: object
          required: [id, name, rsvpStatus]
          properties:
            id: { type: number }
            name: { type: string }
            rsvpStatus:
              type: string
              enum: [confirmed, declined]

    Notification:
      type: object
      required: [id, weddingId, kind, title, body, read, dedupeKey, createdAt]
      properties:
        id: { type: number }
        weddingId: { type: number }
        kind: { type: string }
        title: { type: string }
        body: { type: string }
        route: { type: ["string", "null"] }
        read: { type: boolean }
        dedupeKey: { type: string }
        createdAt: { type: string }

    PushTokenRegistration:
      type: object
      required: [token, platform]
      properties:
        token: { type: string }
        platform:
          type: string
          enum: [ios, android]

    PushTokenRegistrationResult:
      type: object
      required: [registered]
      properties:
        registered: { type: boolean }

    PushTokenUnregistration:
      type: object
      required: [token]
      properties:
        token: { type: string }

    GuestInput:
      type: object
      required: [name, rsvpStatus]
      properties:
        name:
          type: string
        email:
          type: string
        tableNumber:
          type: string
        dietaryRequirements:
          type: string
        rsvpStatus:
          type: string
          enum: [confirmed, pending, declined]
        notes:
          type: string

    GuestImportInput:
      type: object
      required: [guests]
      properties:
        guests:
          type: array
          items:
            $ref: "#/components/schemas/GuestInput"

    GuestUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        tableNumber:
          type: string
        dietaryRequirements:
          type: string
        rsvpStatus:
          type: string
          enum: [confirmed, pending, declined]
        notes:
          type: string

    GuestStats:
      type: object
      required: [total, confirmed, pending, declined]
      properties:
        total:
          type: number
        confirmed:
          type: number
        pending:
          type: number
        declined:
          type: number

    GuestImportResult:
      type: object
      required: [created, skipped]
      properties:
        created:
          type: number
        skipped:
          type: number

    # ─── Budget ───────────────────────────────────────────────
    BudgetCategory:
      type: object
      required: [id, weddingId, name, allocatedCents, spentCents, createdAt]
      properties:
        id:
          type: number
        weddingId:
          type: number
        name:
          type: string
        allocatedCents:
          type: number
        spentCents:
          type: number
        createdAt:
          type: string

    BudgetCategoryInput:
      type: object
      required: [name, allocatedCents]
      properties:
        name:
          type: string
        allocatedCents:
          type: number
        spentCents:
          type: number

    BudgetCategoryUpdate:
      type: object
      properties:
        name:
          type: string
        allocatedCents:
          type: number
        spentCents:
          type: number

    BudgetSummary:
      type: object
      required: [weddingId, totalAllocated, totalSpent, categories]
      properties:
        weddingId:
          type: number
        totalAllocated:
          type: number
        totalSpent:
          type: number
        categories:
          type: array
          items:
            $ref: "#/components/schemas/BudgetCategory"

    # ─── CalendarEvent ────────────────────────────────────────
    CalendarEvent:
      type: object
      required: [id, weddingId, title, eventDate, createdAt]
      properties:
        id:
          type: number
        weddingId:
          type: number
        title:
          type: string
        detail:
          type: ["string", "null"]
        eventDate:
          type: string
          description: ISO date string (YYYY-MM-DD)
        eventTime:
          type: ["string", "null"]
          description: HH:MM format
        location:
          type: ["string", "null"]
          description: Venue or room for this event
        actors:
          type: ["string", "null"]
          description: Comma-separated list of participants/actors
        tone:
          type: ["string", "null"]
          enum: [gold, rose, sage, plum, lavender, blue, null]
        completed:
          type: boolean
        createdAt:
          type: string

    CalendarEventInput:
      type: object
      required: [title, eventDate]
      properties:
        title:
          type: string
        detail:
          type: string
        eventDate:
          type: string
        eventTime:
          type: string
        location:
          type: string
        actors:
          type: string
        tone:
          type: string
          enum: [gold, rose, sage, plum, lavender, blue]
        completed:
          type: boolean

    CalendarEventUpdate:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
        eventDate:
          type: string
        eventTime:
          type: string
        location:
          type: string
        actors:
          type: string
        tone:
          type: string
          enum: [gold, rose, sage, plum, lavender, blue]
        completed:
          type: boolean

    # ─── Contract ─────────────────────────────────────────────
    Contract:
      type: object
      required: [id, weddingId, vendorName, status, totalAmountCents, createdAt]
      properties:
        id:
          type: number
        weddingId:
          type: number
        vendorId:
          type: ["number", "null"]
        vendorName:
          type: string
        status:
          type: string
          enum: [signed, pending, partial, cancelled]
        totalAmountCents:
          type: number
        depositPaidCents:
          type: ["number", "null"]
        signedDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    ContractInput:
      type: object
      required: [vendorName, status, totalAmountCents]
      properties:
        vendorId:
          type: number
        vendorName:
          type: string
        status:
          type: string
          enum: [signed, pending, partial, cancelled]
        totalAmountCents:
          type: number
        depositPaidCents:
          type: number
        signedDate:
          type: string
        notes:
          type: string

    ContractUpdate:
      type: object
      properties:
        vendorName:
          type: string
        status:
          type: string
          enum: [signed, pending, partial, cancelled]
        totalAmountCents:
          type: number
        depositPaidCents:
          type: number
        signedDate:
          type: string
        notes:
          type: string

    # ─── Payment ──────────────────────────────────────────────
    Payment:
      type: object
      required: [id, weddingId, vendorName, description, amountCents, dueDate, status, createdAt]
      properties:
        id:
          type: number
        weddingId:
          type: number
        vendorId:
          type: ["number", "null"]
        vendorName:
          type: string
        description:
          type: string
        amountCents:
          type: number
        dueDate:
          type: string
          description: ISO date string (YYYY-MM-DD)
        status:
          type: string
          enum: [pending, paid, overdue, scheduled]
        paidDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    PaymentInput:
      type: object
      required: [vendorName, description, amountCents, dueDate, status]
      properties:
        vendorId:
          type: number
        vendorName:
          type: string
        description:
          type: string
        amountCents:
          type: number
        dueDate:
          type: string
        status:
          type: string
          enum: [pending, paid, overdue, scheduled]
        paidDate:
          type: string
        notes:
          type: string

    PaymentUpdate:
      type: object
      properties:
        vendorName:
          type: string
        description:
          type: string
        amountCents:
          type: number
        dueDate:
          type: string
        status:
          type: string
          enum: [pending, paid, overdue, scheduled]
        paidDate:
          type: string
        notes:
          type: string

    # ─── OpenAI / Nuptia ──────────────────────────────────────────────────────
    OpenaiConversation:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, title, createdAt]
    OpenaiMessage:
      type: object
      properties:
        id:
          type: number
        conversationId:
          type: number
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, role, content, createdAt]
    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required: [title]
    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required: [content]
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required: [id, title, createdAt, messages]
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
