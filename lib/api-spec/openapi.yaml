openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: The Nuptial Plan – Wedding planner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: weddings
    description: Wedding file management
  - name: vendors
    description: Vendor team management
  - name: guests
    description: Guest list management
  - name: budget
    description: Budget tracking
  - name: events
    description: Calendar events and milestones
  - name: contracts
    description: Contract tracking
  - name: payments
    description: Payment tracking
  - name: dashboard
    description: Dashboard summary data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Weddings ─────────────────────────────────────────────────
  /weddings:
    get:
      operationId: listWeddings
      tags: [weddings]
      summary: List all weddings
      responses:
        "200":
          description: List of weddings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wedding"
    post:
      operationId: createWedding
      tags: [weddings]
      summary: Create a new wedding file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeddingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wedding"

  /weddings/{id}:
    get:
      operationId: getWedding
      tags: [weddings]
      summary: Get a wedding by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Wedding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wedding"
        "404":
          description: Not found
    patch:
      operationId: updateWedding
      tags: [weddings]
      summary: Update a wedding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeddingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wedding"
    delete:
      operationId: deleteWedding
      tags: [weddings]
      summary: Delete a wedding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /weddings/{id}/summary:
    get:
      operationId: getWeddingSummary
      tags: [dashboard]
      summary: Get dashboard summary for a wedding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeddingSummary"

  /weddings/{id}/activity:
    get:
      operationId: getWeddingActivity
      tags: [dashboard]
      summary: Get recent activity feed for a wedding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ─── Vendors ──────────────────────────────────────────────────
  /weddings/{weddingId}/vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Add a vendor to a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /weddings/{weddingId}/vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get a vendor by ID
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Not found
    patch:
      operationId: updateVendor
      tags: [vendors]
      summary: Update a vendor
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
    delete:
      operationId: deleteVendor
      tags: [vendors]
      summary: Delete a vendor
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── Guests ───────────────────────────────────────────────────
  /weddings/{weddingId}/guests:
    get:
      operationId: listGuests
      tags: [guests]
      summary: List guests for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of guests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"
    post:
      operationId: createGuest
      tags: [guests]
      summary: Add a guest to a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"

  /weddings/{weddingId}/guests/{id}:
    patch:
      operationId: updateGuest
      tags: [guests]
      summary: Update a guest
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
    delete:
      operationId: deleteGuest
      tags: [guests]
      summary: Delete a guest
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /weddings/{weddingId}/guests/stats:
    get:
      operationId: getGuestStats
      tags: [guests]
      summary: RSVP stats for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Guest stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestStats"

  # ─── Budget ───────────────────────────────────────────────────
  /weddings/{weddingId}/budget-categories:
    get:
      operationId: listBudgetCategories
      tags: [budget]
      summary: List budget categories for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of budget categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetCategory"
    post:
      operationId: createBudgetCategory
      tags: [budget]
      summary: Create a budget category
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetCategory"

  /weddings/{weddingId}/budget-categories/{id}:
    patch:
      operationId: updateBudgetCategory
      tags: [budget]
      summary: Update a budget category
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetCategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetCategory"
    delete:
      operationId: deleteBudgetCategory
      tags: [budget]
      summary: Delete a budget category
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /weddings/{weddingId}/budget-summary:
    get:
      operationId: getBudgetSummary
      tags: [budget]
      summary: Aggregate budget summary for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Budget summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSummary"

  # ─── Events ───────────────────────────────────────────────────
  /weddings/{weddingId}/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List calendar events for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a calendar event
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"

  /weddings/{weddingId}/events/{id}:
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update a calendar event
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete a calendar event
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── Contracts ────────────────────────────────────────────────
  /weddings/{weddingId}/contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List contracts for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
    post:
      operationId: createContract
      tags: [contracts]
      summary: Create a contract
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /weddings/{weddingId}/contracts/{id}:
    patch:
      operationId: updateContract
      tags: [contracts]
      summary: Update a contract
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
    delete:
      operationId: deleteContract
      tags: [contracts]
      summary: Delete a contract
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ─── Payments ─────────────────────────────────────────────────
  /weddings/{weddingId}/payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments for a wedding
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a payment
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /weddings/{weddingId}/payments/{id}:
    patch:
      operationId: updatePayment
      tags: [payments]
      summary: Update a payment
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
    delete:
      operationId: deletePayment
      tags: [payments]
      summary: Delete a payment
      parameters:
        - name: weddingId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── Wedding ──────────────────────────────────────────────
    Wedding:
      type: object
      required: [id, names, currency, weddingDate, venue, totalBudget, guestCount, createdAt]
      properties:
        id:
          type: number
        names:
          type: string
          description: "e.g. Sophie & James Hartwell"
        partner1:
          type: string
          description: "Prénom du premier marié"
        partner2:
          type: string
          description: "Prénom du second marié"
        currency:
          type: string
          description: "ISO 4217 currency code, e.g. EUR, GBP, USD"
        weddingDate:
          type: string
          description: ISO date string (YYYY-MM-DD)
        venue:
          type: string
        totalBudget:
          type: number
          description: Total budget in minor currency units (cents/pence)
        guestCount:
          type: number
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    WeddingInput:
      type: object
      required: [names, currency, weddingDate, venue, totalBudget, guestCount]
      properties:
        names:
          type: string
        partner1:
          type: string
        partner2:
          type: string
        currency:
          type: string
        weddingDate:
          type: string
        venue:
          type: string
        totalBudget:
          type: number
        guestCount:
          type: number
        notes:
          type: string

    WeddingUpdate:
      type: object
      properties:
        names:
          type: string
        partner1:
          type: string
        partner2:
          type: string
        currency:
          type: string
        weddingDate:
          type: string
        venue:
          type: string
        totalBudget:
          type: number
        guestCount:
          type: number
        notes:
          type: string

    WeddingSummary:
      type: object
      required: [weddingId, daysUntil, confirmedGuests, totalGuests, budgetSpent, budgetTotal, tasksComplete, tasksTotal, upcomingEvents, vendorCount, pendingPaymentsTotal]
      properties:
        weddingId:
          type: number
        daysUntil:
          type: number
        confirmedGuests:
          type: number
        totalGuests:
          type: number
        budgetSpent:
          type: number
        budgetTotal:
          type: number
        tasksComplete:
          type: number
        tasksTotal:
          type: number
        upcomingEvents:
          type: number
        vendorCount:
          type: number
        pendingPaymentsTotal:
          type: number

    ActivityItem:
      type: object
      required: [id, weddingId, description, entityType, createdAt]
      properties:
        id:
          type: number
        weddingId:
          type: number
        description:
          type: string
        entityType:
          type: string
          enum: [vendor, guest, contract, payment, event, wedding]
        initials:
          type: ["string", "null"]
        createdAt:
          type: string

    # ─── Vendor ───────────────────────────────────────────────
    Vendor:
      type: object
      required: [id, weddingId, name, category, status, totalAmountCents, createdAt]
      properties:
        id:
          type: number
        weddingId:
          type: number
        name:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [confirmed, awaiting_contract, deposit_paid, cancelled]
        totalAmountCents:
          type: number
        depositAmountCents:
          type: ["number", "null"]
        contactName:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    VendorInput:
      type: object
      required: [name, category, status, totalAmountCents]
      properties:
        name:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [confirmed, awaiting_contract, deposit_paid, cancelled]
        totalAmountCents:
          type: number
        depositAmountCents:
          type: number
        contactName:
          type: string
        contactEmail:
          type: string
        notes:
          type: string

    VendorUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        status:
          type: string
          enum: [confirmed, awaiting_contract, deposit_paid, cancelled]
        totalAmountCents:
          type: number
        depositAmountCents:
          type: number
        contactName:
          type: string
        contactEmail:
          type: string
        notes:
          type: string

    # ─── Guest ────────────────────────────────────────────────
    Guest:
      type: object
      required: [id, weddingId, name, rsvpStatus, createdAt]
      properties:
        id:
          type: number
        weddingId:
          type: number
        name:
          type: string
        email:
          type: ["string", "null"]
        tableNumber:
          type: ["string", "null"]
        dietaryRequirements:
          type: ["string", "null"]
        rsvpStatus:
          type: string
          enum: [confirmed, pending, declined]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    GuestInput:
      type: object
      required: [name, rsvpStatus]
      properties:
        name:
          type: string
        email:
          type: string
        tableNumber:
          type: string
        dietaryRequirements:
          type: string
        rsvpStatus:
          type: string
          enum: [confirmed, pending, declined]
        notes:
          type: string

    GuestUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        tableNumber:
          type: string
        dietaryRequirements:
          type: string
        rsvpStatus:
          type: string
          enum: [confirmed, pending, declined]
        notes:
          type: string

    GuestStats:
      type: object
      required: [total, confirmed, pending, declined]
      properties:
        total:
          type: number
        confirmed:
          type: number
        pending:
          type: number
        declined:
          type: number

    # ─── Budget ───────────────────────────────────────────────
    BudgetCategory:
      type: object
      required: [id, weddingId, name, allocatedCents, spentCents, createdAt]
      properties:
        id:
          type: number
        weddingId:
          type: number
        name:
          type: string
        allocatedCents:
          type: number
        spentCents:
          type: number
        createdAt:
          type: string

    BudgetCategoryInput:
      type: object
      required: [name, allocatedCents]
      properties:
        name:
          type: string
        allocatedCents:
          type: number
        spentCents:
          type: number

    BudgetCategoryUpdate:
      type: object
      properties:
        name:
          type: string
        allocatedCents:
          type: number
        spentCents:
          type: number

    BudgetSummary:
      type: object
      required: [weddingId, totalAllocated, totalSpent, categories]
      properties:
        weddingId:
          type: number
        totalAllocated:
          type: number
        totalSpent:
          type: number
        categories:
          type: array
          items:
            $ref: "#/components/schemas/BudgetCategory"

    # ─── CalendarEvent ────────────────────────────────────────
    CalendarEvent:
      type: object
      required: [id, weddingId, title, eventDate, createdAt]
      properties:
        id:
          type: number
        weddingId:
          type: number
        title:
          type: string
        detail:
          type: ["string", "null"]
        eventDate:
          type: string
          description: ISO date string (YYYY-MM-DD)
        eventTime:
          type: ["string", "null"]
          description: HH:MM format
        tone:
          type: ["string", "null"]
          enum: [gold, rose, sage, null]
        completed:
          type: boolean
        createdAt:
          type: string

    CalendarEventInput:
      type: object
      required: [title, eventDate]
      properties:
        title:
          type: string
        detail:
          type: string
        eventDate:
          type: string
        eventTime:
          type: string
        tone:
